name: Site

# Publishes site/ to GitHub Pages whenever it changes on main. The site's home is dictate.tech
# (cloudflare-pages.yml); this copy keeps the old spashii.github.io/dictate/ links working.
on:
  push:
    branches: [main]
    paths: ["site/**", "tools/site-build.sh"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Same build as dictate.tech, so this copy matches it; _headers is Cloudflare's alone.
      - name: Build
        run: |
          tools/site-build.sh _site
          rm _site/_headers
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
