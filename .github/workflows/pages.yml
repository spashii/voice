name: Site

# Keeps the old spashii.github.io/dictate/ links working for good. The site lives on dictate.tech
# (cloudflare-pages.yml); GitHub Pages serves a stub at every old path that forwards to the same path there,
# query string and #fragment included (shipped apps open activate/#n=<nonce> here).
on:
  push:
    branches: [main]
    paths: ["site/**", "tools/github-stubs.sh"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build stubs
        run: tools/github-stubs.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
