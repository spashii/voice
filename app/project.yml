name: Voice
options:
  bundleIdPrefix: io.github.spashii
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    # tools/build.sh and tools/release.sh set these from the VERSION file.
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  # Records, transcribes, cleans up and stores; shared with dictate-cli.
  VoiceCore:
    path: ../Core
  # Records both sides of a call and meters call apps (Blend Mic's engine).
  # Pinned to the Blend Mic release; move it by hand to the next one.
  BlendKit:
    url: https://github.com/spashii/blend
    exactVersion: 0.9.0
  # The global shortcuts, and the fields that record them in Settings.
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
  # Updates: checks the appcast on the website and installs signed releases.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Voice:
    type: application
    platform: macOS
    sources:
      - path: Voice
        excludes: ["*.entitlements"]
      # Shipped inside the app, as the licenses of the included libraries require.
      - path: ../LICENSE
        buildPhase: resources
      - path: ../THIRD_PARTY_NOTICES.md
        buildPhase: resources
      # The release notes About shows; tools/release.sh also puts the newest entry in the update feed.
      - path: ../CHANGELOG.md
        buildPhase: resources
    info:
      path: Voice/Info.plist
      properties:
        CFBundleName: Dictate
        CFBundleDisplayName: Dictate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 The Dictate authors. FSL-1.1-MIT."
        NSMicrophoneUsageDescription: Dictate records your microphone while you dictate or record a call.
        # Shown when Dictate first records the call app's sound.
        NSAudioCaptureUsageDescription: Dictate records the call app's sound, so the other side of the call is transcribed. It records nothing else.
        # The private download site serves the feed and counts update checks.
        SUFeedURL: $(SU_FEED_URL)
        # Updates must be signed with the matching private key, kept with the Developer ID.
        SUPublicEDKey: YLvPSGEaYiPsXphy/q9LCDGs2s0qp8hM2LVBIWbl78c=
        # Sparkle names the app in its dialogs from this key first, in every process it runs.
        SUBundleName: Dictate
        # Activation returns to the app through this scheme. Each configuration has its own, so a
        # development build never receives the links meant for the installed app.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [$(ACTIVATION_URL_SCHEME)]
        DictateActivationURL: $(ACTIVATION_BASE_URL)
        DictateDataRoot: $(DICTATE_DATA_ROOT)
    entitlements:
      path: Voice/Voice.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.spashii.voice
        # The file is Dictate.app. The bundle id stays, so settings, permissions and updates carry over.
        PRODUCT_NAME: Dictate
        # FoundationModels exists from macOS 26 and the app runs on 15: linked weakly, it is
        # absent there and the code only reaches it behind an availability check.
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels"]
        # Voice/AppIcon.icon is an Icon Composer icon. actool compiles it into Assets.car
        # for macOS 26 and an AppIcon.icns for macOS 15; XcodeGen types it wrapper.icon,
        # which Xcode still routes to actool.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ad hoc unless tools/build.sh or tools/release.sh passes an identity.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        # Off while builds are signed with a self-signed certificate: the hardened runtime
        # won't load the embedded whisper framework under a certificate without a team.
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_DEBUG_DYLIB: NO
        SU_FEED_URL: https://apps.firstversion.in/voice/appcast.xml
        ACTIVATION_URL_SCHEME: in.firstversion.dictate
        ACTIVATION_BASE_URL: https://spashii.github.io/dictate/activate/
        DICTATE_DATA_ROOT: ""
      configs:
        # Debug builds are a separate app: own bundle id, URL scheme, data folder and no update
        # feed, so running one beside the installed Dictate never touches its data, settings,
        # shortcut or updates.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.spashii.voice.dev
          PRODUCT_NAME: Dictate Dev
          SU_FEED_URL: ""
          ACTIVATION_URL_SCHEME: in.firstversion.dictate.dev
          ACTIVATION_BASE_URL: http://localhost:8800/activate/
          DICTATE_DATA_ROOT: "~/Library/Application Support/DictateDev"
        # Only tools/release.sh builds Release, always with the Developer ID, and
        # notarization needs the hardened runtime. Xcode otherwise adds the debugger
        # entitlement, which notarization rejects.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    dependencies:
      - package: VoiceCore
        product: VoiceCore
      - package: BlendKit
      - package: KeyboardShortcuts
      - package: Sparkle
      - sdk: AppKit.framework
      - sdk: AVFoundation.framework
      - sdk: ServiceManagement.framework
  # Swift tests of the app's own logic. They compile the sources they test rather than load
  # Dictate.app, so a test run never starts a second Dictate beside the one in use.
  VoiceTests:
    type: bundle.unit-test
    platform: macOS
    dependencies:
      - package: VoiceCore
        product: VoiceCore
    sources:
      - path: VoiceTests
      - path: Voice/SupportItems.swift
      - path: Voice/WindowPolicy.swift
      - path: Voice/FirstLaunch.swift
      - path: Voice/PillHover.swift
      - path: Voice/NoticesDocument.swift
      - path: Voice/BlendMic.swift
      - path: Voice/CallAudioText.swift
      - path: Voice/BundleRename.swift
      - path: Voice/OtherInstance.swift
      - path: Voice/RecordingGate.swift
      - path: Voice/LockPolicy.swift
      - path: Voice/MainPane.swift
      - path: Voice/HistoryDisplay.swift
      - path: Voice/HistoryImport.swift
      - path: Voice/RowNaming.swift
      - path: Voice/SecureInput.swift
      - path: Voice/LocalModelChoice.swift
      - path: Voice/RecentCallLabel.swift
      - path: Voice/Changelog.swift
      - path: Voice/UpdateAvailability.swift
      - path: Voice/KeyTermConfirmation.swift
      - path: Voice/RetentionText.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.spashii.voice.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: [VoiceTests]
